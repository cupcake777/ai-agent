name: History Check

# Rejects PRs whose branch has no common ancestor with the PR base branch.
#
# In May 2026 PR #25045 was merged from a branch that had been disconnected
# from the base branch's history (likely an accidental `git checkout --orphan` or
# `.git/` re-init).  GitHub's merge UI does not refuse merges of unrelated
# histories, so the PR landed cleanly with the intended one-file change —
# but its parent-less root commit (413990c94) got grafted into the base branch as a
# second root, and ~1500 files' worth of `git blame` history collapsed
# onto that single commit.
#
# This check catches the failure mode by requiring `git merge-base` between
# the PR head and base branch to be non-empty.

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON array of review_status objects for the synthesizer."
        value: ${{ jobs.check-common-ancestor.outputs.review_status }}

permissions:
  contents: read

jobs:
  check-common-ancestor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      review_status: ${{ steps.merge-base-check.outputs.review_status }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history both sides for merge-base

      - id: merge-base-check
        name: Reject PRs with no common ancestor on base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          # `git merge-base` exits non-zero AND prints nothing when the two
          # commits share no ancestor.  We check both conditions explicitly
          # so the failure message is clear regardless of which signal fires
          # first.
          if ! BASE=$(git merge-base "origin/${BASE_BRANCH}" HEAD 2>/dev/null) || [ -z "$BASE" ]; then
            STATUS='[{"source":"unrelated histories","results":[{"kind":"action_required","title":"Unrelated histories","summary":"This PR has no common ancestor with its base branch.","detail":"","how_to_fix":"Rebase your changes onto the current base branch:\n```\ngit fetch origin '"${BASE_BRANCH}"'\ngit checkout -b fix-branch origin/'"${BASE_BRANCH}"'\n# re-apply your changes (cherry-pick, copy files, etc.)\ngit push -f origin fix-branch\n```\n"}]}]'
            echo "review_status=${STATUS}" >> "$GITHUB_OUTPUT"
            echo ""
            echo "::error::This PR has no common ancestor with base branch '${BASE_BRANCH}'."
            echo ""
            echo "Your branch's history is disconnected from its base branch.  Common causes:"
            echo "  - the branch was created with 'git checkout --orphan'"
            echo "  - '.git/' was re-initialized at some point during the work"
            echo "  - the branch was force-pushed from an unrelated repository"
            echo ""
            echo "Merging an unrelated-history PR grafts a parent-less root commit"
            echo "into the base branch and collapses git blame for every file in that snapshot."
            echo "Reference: PR #25045 caused this and re-rooted blame on ~1500"
            echo "files to a single orphan commit."
            echo ""
            echo "To fix, rebase your changes onto base branch '${BASE_BRANCH}':"
            echo "  git fetch origin ${BASE_BRANCH}"
            echo "  git checkout -b fix-branch origin/${BASE_BRANCH}"
            echo "  # re-apply your changes (cherry-pick, copy files, etc.)"
            echo "  git push -f origin fix-branch"
            exit 1
          fi
          echo "::notice::Common ancestor with base branch '${BASE_BRANCH}': $BASE"
          echo "review_status=[]" >> "$GITHUB_OUTPUT"
